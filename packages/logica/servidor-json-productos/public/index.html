<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion de Productos</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="layout">
    <section class="hero">
      <div>
        <p class="eyebrow">Node + JSON</p>
        <h1>Gestion de Productos</h1>
        <p class="lead">
          Cliente REST para listar, ordenar y agregar productos consumiendo un servidor Node que lee productos desde archivo en forma non-blocking.
        </p>
      </div>
      <img src="./producto.svg" alt="Ilustracion de productos" class="hero-image" />
    </section>

    <section class="panel actions">
      <div class="toolbar">
        <button id="load-products">LISTA DE ARTICULOS</button>
        <label>
          Ordenar por
          <select id="sort-by">
            <option value="nombre">Nombre</option>
            <option value="precio">Precio</option>
          </select>
        </label>
      </div>

      <form id="product-form" class="product-form">
        <input id="nombre" name="nombre" type="text" placeholder="Nombre del producto" required />
        <input id="precio" name="precio" type="number" min="0" step="1" placeholder="Precio" required />
        <button type="submit">AGREGAR NUEVO PRODUCTO</button>
      </form>
    </section>

    <section class="panel output">
      <div class="section-head">
        <h2>Productos</h2>
        <p id="status">Carga la lista para ver los productos actuales.</p>
      </div>
      <div id="result" class="result"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
