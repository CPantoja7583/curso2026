<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Conductores y Automóviles</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="layout">
    <header class="hero">
      <p class="eyebrow">Express + SQL</p>
      <h1>Conductores y Automóviles</h1>
      <p class="lead">
        Cliente simple para consumir la API del ejercicio. Cada accion llama un endpoint y muestra el resultado en tablas o tarjetas.
      </p>
    </header>

    <section class="panel controls">
      <div class="button-group">
        <button data-action="conductores">GET /conductores</button>
        <button data-action="automoviles">GET /automoviles</button>
        <button data-action="solitos">GET /solitos</button>
      </div>

      <form id="form-edad" class="inline-form">
        <label for="edad">GET /conductoressinauto?edad=</label>
        <input id="edad" name="edad" type="number" min="1" placeholder="Ej: 30" required />
        <button type="submit">Consultar</button>
      </form>

      <form id="form-patente" class="inline-form">
        <label for="patente">GET /auto?patente=</label>
        <input id="patente" name="patente" type="text" placeholder="Ej: HXJH55" required />
        <button type="submit">Buscar auto</button>
      </form>

      <form id="form-inicio" class="inline-form">
        <label for="inicio">GET /auto?iniciopatente=</label>
        <input id="inicio" name="inicio" type="text" maxlength="1" placeholder="Ej: H" required />
        <button type="submit">Buscar por inicio</button>
      </form>
    </section>

    <section class="panel output">
      <div class="section-head">
        <h2>Resultado</h2>
        <p id="status">Selecciona una consulta para ver la respuesta del servidor.</p>
      </div>
      <div id="result" class="result"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
