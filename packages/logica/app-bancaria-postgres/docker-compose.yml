services:
  db:
    image: postgres:16-alpine
    container_name: app-bancaria-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_bancaria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_bank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_bancaria"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_bank_data:
